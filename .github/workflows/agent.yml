name: agent invoke

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  pull_request_review:
  pull_request_review_comment:
  workflow_dispatch:
  issues:
  issue_comment:

permissions:
  actions: write
  id-token: write

jobs:
  authorize:
    permissions: {}
    uses: promplate/code-review/.github/workflows/authorize.yml@main

  agent:
    needs: authorize
    if: needs.authorize.outputs.writer == 'true'
    cache-mode: write
    concurrency:
      group: code-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: promplate/code-review@main
        with:
          codex-config: ${{ secrets.CODEX_CONFIG }}
          codex-auth: ${{ secrets.CODEX_AUTH }}
