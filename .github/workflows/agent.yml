name: agent invoke

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  pull_request_review:
  pull_request_review_comment:
  workflow_dispatch:
  push:
  issues:
  issue_comment:

permissions:
  actions: write
  id-token: write

jobs:
  review:
    # Pushes are filtered here because `on.push` cannot name the repository's current default branch.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    uses: promplate/code-review/.github/workflows/review.yml@main
    secrets:
      codex-config: ${{ secrets.CODEX_CONFIG }}
      codex-auth: ${{ secrets.CODEX_AUTH }}
